name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # The suite is integration-level and talks to real MySQL and Redis: what it
    # verifies is the interaction between them (atomic seat locks, a unique
    # index refusing a second claim, stored-procedure status guards). The
    # previous workflow ran `npm test` with no datastores at all, so it could
    # not have passed.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: MovieBookingDB
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: MovieBookingDB
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SEAT_LOCK_TTL: 600
      # CI-only values. Real deployments must supply their own; the app
      # refuses to boot in production without them.
      JWT_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
      WEBHOOK_SECRET: ci-only-webhook-secret-not-used-anywhere-else
      # Kafka is absent here; the producer degrades to its in-process bus.
      KAFKA_BROKERS: localhost:9092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Apply schema and seed data
        working-directory: backend
        run: npm run db:setup

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  end-to-end:
    name: End-to-end booking flow
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          cp .env.example .env
          {
            echo "DB_PASSWORD=rootpassword"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "WEBHOOK_SECRET=$(openssl rand -hex 32)"
          } >> .env

      - name: Start the stack
        run: docker compose up -d --build mysql redis backend

      - name: Wait for the backend to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health | grep -q '"status":"ok"'; then
              echo "backend healthy"; exit 0
            fi
            sleep 5
          done
          echo "backend never became healthy"; docker compose logs backend; exit 1

      # Exercises the whole acceptance path over HTTP against the built
      # images: admin builds a catalogue, a customer books and pays, and the
      # concurrency and webhook-idempotency guarantees are asserted.
      - name: Run the end-to-end verification
        run: docker compose exec -T backend node scripts/verifyFlow.js

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          # Root context: the image needs MovieBookingSystem/*.sql.
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: cinewave-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: cinewave-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
