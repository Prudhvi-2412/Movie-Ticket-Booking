# Security headers, included into every location block.
#
# nginx's add_header does NOT merge across levels: a single add_header inside a
# location silently discards every add_header inherited from the server block.
# Declaring these once at server level meant the SPA document — the one
# response where CSP actually matters — was served with no security headers at
# all, because `location /` sets its own Cache-Control.
#
# Including the same file everywhere is the standard fix and makes the
# duplication explicit rather than accidental.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Razorpay Checkout needs more than the one script domain: it loads a
# risk-detection bundle from cdn.razorpay.com, renders inside an
# api.razorpay.com iframe, and posts telemetry to the lumberjack hosts. Miss
# any of them and checkout either fails to open or degrades silently.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; frame-src https://www.youtube.com https://api.razorpay.com https://checkout.razorpay.com; child-src https://api.razorpay.com; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://lumberjack-cx.razorpay.com; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'self'" always;
