server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version to the internet.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # --- Security headers -------------------------------------------
    # CSP lives here rather than in helmet: helmet guards the JSON API, which
    # renders no markup, while these apply to the document the browser runs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Razorpay Checkout injects a script and renders inside an iframe, and
    # posts telemetry to lumberjack.razorpay.com — all three need allowing or
    # payment silently fails to open.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.youtube.com https://api.razorpay.com https://checkout.razorpay.com; child-src https://api.razorpay.com; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'self'" always;

    # --- Static assets ----------------------------------------------
    # Vite fingerprints every filename, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 30d;
        access_log off;
    }

    # --- API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend trusts X-Forwarded-For for rate limiting, so it has to
        # receive the real client address rather than the proxy's.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /health {
        proxy_pass http://backend:5000/health;
        access_log off;
    }

    # --- SPA fallback -------------------------------------------------
    # index.html must never be cached, or a returning visitor keeps loading
    # the previous deploy's asset filenames and gets a blank page.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
