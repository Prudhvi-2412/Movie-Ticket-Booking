server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version to the internet.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # --- Static assets ----------------------------------------------
    # Vite fingerprints every filename, so these can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        access_log off;
    }

    # --- API ---------------------------------------------------------
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend trusts X-Forwarded-For for rate limiting, so it has to
        # receive the real client address rather than the proxy's.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /health {
        proxy_pass http://backend:5000/health;
        access_log off;
    }

    # --- SPA fallback -------------------------------------------------
    # index.html must never be cached, or a returning visitor keeps loading
    # the previous deploy's asset filenames and gets a blank page.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
