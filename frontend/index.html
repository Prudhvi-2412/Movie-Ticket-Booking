<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090D" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>CineWave — Book movie tickets</title>
    <meta
      name="description"
      content="Book cinema tickets across India with CineWave. Live seat availability, seats held while you check out, and your ticket on your phone the moment you pay."
    />

    <!--
      Fonts are preconnected and loaded here rather than @imported from CSS:
      an @import inside the stylesheet is discovered a round trip later and
      delays first paint of every text node on the page.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      No Tailwind CDN script here. Tailwind is compiled at build time from
      tailwind.config.js; loading the CDN as well shipped a second, differently
      configured copy of the framework that raced the real stylesheet and
      overrode the design tokens.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color:#F5F7FA;background:#08090D;font-family:sans-serif;padding:2rem;text-align:center">
        CineWave needs JavaScript enabled to book tickets.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
